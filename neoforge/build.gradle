import net.neoforged.moddevgradle.dsl.ModModel
import net.neoforged.moddevgradle.dsl.RunModel

plugins {
    id 'lazycraft.loader'
    id 'net.neoforged.moddev'
}

def neoForgeProjectPath = path
def clientGameDirectory = layout.projectDirectory.dir('runs/client')
def serverGameDirectory = layout.projectDirectory.dir('runs/server')
def commonProject = rootProject.findProject(':common')
assert commonProject != null
SourceSetContainer commonSourceSets = commonProject
        .extensions.getByType(SourceSetContainer)
def commonMainSourceSet = commonSourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME)
def neoForgeMainSourceSet = sourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME)

neoForge {
    version = neoforge_version

    runs {
        configureEach { RunModel run ->
            run.ideName.set(
                    "NeoForge ${run.name.capitalize()} (${neoForgeProjectPath})"
            )
        }

        client { RunModel run ->
            run.client()
            run.gameDirectory.set(clientGameDirectory)
        }

        server { RunModel run ->
            run.server()
            run.gameDirectory.set(serverGameDirectory)
        }
    }

    mods {
        "${mod_id}" { ModModel mod ->
            mod.sourceSet(neoForgeMainSourceSet.get())
        }
    }
}

dependencies {
    compileOnly project(':common')
    implementation "maven.modrinth:9s6osm5g:${cloth_config_neoforge_version}"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn commonProject.tasks.named('classes')
    source commonMainSourceSet.get().java
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processResources', ProcessResources) {
    from(commonProject.tasks.named('processResources'))

    def resourceProperties = [
            version                         : project.version,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_author                      : mod_author,
            license                         : license,
            description                     : project.property('description'),
            neoforge_loader_version_range   : neoforge_loader_version_range,
            neoforge_version                : neoforge_version,
            neoforge_version_range: neoforge_version_range,
            neoforge_minecraft_version_range: neoforge_minecraft_version_range
    ]
    inputs.properties(resourceProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(resourceProperties)
    }
}
