plugins {
    id 'net.fabricmc.fabric-loom'
    id 'lazycraft.loader'
}

def commonBuildOutput = rootProject.layout.projectDirectory.dir('common/build')

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    SourceSetContainer commonSourceSets = rootProject.project(':common')
            .extensions.getByType(SourceSetContainer)
    SourceSetContainer fabricSourceSets = project.extensions.getByType(SourceSetContainer)
    def commonMainSourceSet = commonSourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME)
    def fabricMainSourceSet = fabricSourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME)
    def fabricClientSourceSet = fabricSourceSets.named('client')

    runs {
        client {
            runDirectory.set(project.rootProject.layout.projectDirectory.dir('runs/fabric-client'))
        }
    }

    mods {
        lazycraft {
            sourceSet commonMainSourceSet.get()
            sourceSet fabricMainSourceSet.get()
            sourceSet fabricClientSourceSet.get()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    clientCompileOnly project(':common')
    compileOnly project(':common')
    clientRuntimeOnly files(
            commonBuildOutput.dir('classes/java/main'),
            commonBuildOutput.dir('resources/main')
    )
    clientCompileOnly 'maven.modrinth:9s6osm5g:Nv3xnWXd' // Cloth Config API
    clientCompileOnly 'maven.modrinth:mOgUt4GM:njXb639R' // Mod Menu
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('sourcesJar', Jar) {
    from sourceSets.client.allSource
}
