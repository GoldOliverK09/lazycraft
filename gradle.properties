# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
# Java and project properties
java_version=25
mod_id=lazycraft
mod_name=LazyCraft
mod_author=GoldOliverK09
mod_version=1.3.0
maven_group=klumpler.lazycraft
license=MIT
description=A collection of quality-of-life crafting features to make crafting feel intuitive
# Minecraft version line. Keep this range limited to versions that are built and tested.
minecraft_version=26.1
minecraft_version_range=26.1.x
# The common module is compiled against NeoForm so its source can be shared by Fabric and NeoForge.
neo_form_version=26.1-1
mdg_version=2.0.141
# Fabric properties: check https://fabricmc.net/develop when updating Minecraft.
loader_version=0.19.0
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.0+26.1.2
# NeoForge properties: check https://projects.neoforged.net/neoforged/neoforge when updating Minecraft.
neoforge_version=26.1.2.97
neoforge_loader_version_range=[4,)
neoforge_minecraft_version_range=[26.1,26.2)
# Optional client configuration UI, one artifact per loader.
cloth_config_fabric_version=Nv3xnWXd
cloth_config_neoforge_version=TimoYzse
