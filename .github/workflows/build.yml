# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defense
# against bad commits.

name: Build

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Read project versions
        id: project
        shell: bash
        run: |
          echo "java=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "mod=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.project.outputs.java }}
          distribution: 'microsoft'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Capture Fabric artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazycraft-fabric-mc${{ steps.project.outputs.minecraft }}-v${{ steps.project.outputs.mod }}
          path: |
            fabric/build/libs/lazycraft-fabric-*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
          if-no-files-found: error
      - name: Capture NeoForge artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazycraft-neoforge-mc${{ steps.project.outputs.minecraft }}-v${{ steps.project.outputs.mod }}
          path: |
            neoforge/build/libs/lazycraft-neoforge-*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
          if-no-files-found: error
