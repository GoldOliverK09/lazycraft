name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Read required Java version
        id: java
        shell: bash
        run: echo "version=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release JAR
        run: ./gradlew build --no-daemon

      - name: Collect distribution JARs
        shell: bash
        run: |
          mkdir -p release
          for loader in fabric neoforge forge; do
            directory="$loader/build/libs"
            if [[ -d "$directory" ]]; then
              find "$directory" -maxdepth 1 -type f -name '*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
                -exec cp {} release/ \;
            fi
          done
          test -n "$(find release -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.jar
